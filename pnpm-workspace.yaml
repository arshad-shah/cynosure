# The library is the root package; `site/` is the documentation site (private, never published). The root is listed
# so Changesets finds the library in the workspace.
packages:
  - .
  - site
minimumReleaseAge: 20160 # 14 days: never install a version younger than two weeks
# Our own packages (detent) are trusted the day they are published. The site uses the library beside it, not npm's.
minimumReleaseAgeExclude:
  - "@arshad-shah/*"
onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
