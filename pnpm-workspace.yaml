packages:
  - "packages/*"
  - "apps/*"

# Single source of truth for every external dependency version.
# All package.json files reference these via `"<dep>": "catalog:"`.
# Versions are hard-pinned (no `^` / `~`) so installs are deterministic across
# the workspace.
