# Cloudflare Pages configuration for the Cynosure docs site.
#
# Matches Arshad's existing arshadshah.com infra on Cloudflare.
# See: https://developers.cloudflare.com/pages/configuration/build-configuration/
#
# The docs site is now the Starlight-built Astro docs at
# `packages/docs/dist/`. The Storybook bundle ships at `dist/storybook/` (a
# subpath of the same project) via the `bundle:storybook` step in the docs
# `build` script. One Cloudflare project serves both at cynosure.arshadshah.com.

name = "cynosure-docs"
pages_build_output_dir = "./packages/docs/dist"
compatibility_date = "2026-04-17"
