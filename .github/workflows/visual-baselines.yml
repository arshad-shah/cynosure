name: Update visual baselines
on:
  workflow_dispatch:
  # Dispatch only works once this file is on the default branch; until then a commit on `next` containing [baselines] triggers it.
  push:
    branches: [next]
permissions:
  contents: write
jobs:
  baselines:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[baselines]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GitHub's runners could not resolve Ubuntu's package servers on 2026-11-11 (the browsers' system packages come
      # from them), while public resolvers could. Harmless when the runner's own resolver works.
      - name: Resolve package servers through public DNS
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\nDomains=~.\n' | sudo tee /etc/systemd/resolved.conf.d/public-dns.conf
          sudo systemctl restart systemd-resolved
      # The same browsers' system packages as CI installs (ci.yml), so baselines are drawn with the same fonts: with
      # Chromium's alone, monospace text (Kbd) rendered differently from CI's and the new baseline failed there.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:visual --update
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '**/__screenshots__/**'
          git diff --cached --quiet || git commit -m "test(visual): update Chromium baselines"
          git push
