name: Update visual baselines
on:
  workflow_dispatch:
  # Dispatch only works once this file is on the default branch; until then a commit on `next` containing [baselines] triggers it.
  push:
    branches: [next]
permissions:
  contents: write
jobs:
  baselines:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[baselines]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual --update
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '**/__screenshots__/**'
          git diff --cached --quiet || git commit -m "test(visual): update Chromium baselines"
          git push
