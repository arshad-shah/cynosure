name: Changeset Check
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# One run per PR; newer commits cancel in-flight checks.
concurrency:
  group: changeset-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Require changeset or skip-changeset label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Pin by SHA — the tag `v4` is a moving target and supply-chain
      # risk if ever compromised/re-pointed. Dependabot keeps the SHA
      # fresh via scheduled PRs.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check for changeset or skip label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # Bypass 1: bot-authored PRs. Dependabot doesn't write
          # changesets, and the changesets action's own "Version
          # packages" PR consumes changesets rather than adding them.
          # Both show `user.type == "Bot"`. Requiring a label on every
          # bot PR would mean manual work on each Dependabot update —
          # exactly the toil this automation is meant to eliminate.
          if [ "$AUTHOR_TYPE" = "Bot" ]; then
            echo "::notice::PR authored by bot ($AUTHOR_LOGIN) — bypassing changeset requirement."
            exit 0
          fi

          # Bypass 2: `skip-changeset` label on the PR. Use for
          # human-authored doc-only, tooling, or CI-only changes that
          # don't warrant a release. A label is better than a commit
          # footer for audit — it's visible in the PR history.
          if echo "$LABELS" | grep -q '"skip-changeset"'; then
            echo "::notice::'skip-changeset' label present — bypassing changeset requirement."
            exit 0
          fi

          # Find changeset files introduced by this PR. A changeset is
          # any new `.md` under `.changeset/` (excluding README/config).
          ADDED=$(git diff --name-only --diff-filter=A "origin/${BASE_REF}"...HEAD -- '.changeset/*.md' | grep -Ev '\.changeset/(README|config)\.' || true)

          if [ -z "$ADDED" ]; then
            echo "::error::No changeset found. Run 'pnpm changeset' to describe the release impact of this PR, or apply the 'skip-changeset' label if this change does not warrant a release (docs, CI, tooling only)."
            exit 1
          fi

          echo "Changesets added by this PR:"
          echo "$ADDED"
