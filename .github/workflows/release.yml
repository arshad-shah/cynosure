name: Release
on:
  push:
    branches: [main]
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Environment gate: the npm publish step runs only after a manual
    # approval in the Actions UI. Defence-in-depth against a compromised
    # workflow file — the attacker needs your click, not just the merge.
    # See `required_reviewers` on the `production` environment.
    environment: production
    permissions:
      # `changesets/action@v1` needs write access to open/update the
      # "Version packages" PR and to push release tags.
      contents: write
      pull-requests: write
      # OIDC token for npm Trusted Publishing — no long-lived NPM_TOKEN
      # secret is required when the package has Trusted Publishing
      # configured at https://www.npmjs.com/package/<name>/access.
      id-token: write
    steps:
      # Mint a short-lived GitHub App token so the pushes and the
      # "Version packages" PR this workflow creates are authored by
      # the App (not `github-actions[bot]`). GITHUB_TOKEN-authored
      # events cannot trigger downstream workflows (GitHub's
      # infinite-loop guard) — using the App identity means the
      # Version PR actually runs CI, which in turn unblocks
      # auto-merge.
      #
      # The `permission-*` inputs request the exact scopes this
      # workflow uses. If the App installation is missing any of
      # them, this step fails fast with a clear message instead of
      # surfacing later as an opaque GraphQL "Resource not accessible
      # by integration" from `@changesets/changelog-github` (which
      # reads `Commit.associatedPullRequests`, requiring
      # `pull-requests: read` — implied by `write`).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Use the App token so pushes to `changeset-release/main`
          # are authored by the App, triggering downstream workflows.
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Upgrade npm to a version that supports Trusted Publishing.
      # Node 22 bundles npm 10, which has provenance signing but
      # authenticates publishes via token only. TP (OIDC-based
      # publish auth, no token needed) is npm >= 11.5.1. Without
      # this step, provenance works but the PUT returns a generic
      # "not in this registry" 404 because no token is present.
      #
      # Pinned — not `@latest`. Taking the literal newest npm on
      # every release run turned `npm install -g npm@latest` into
      # a supply-chain-of-CI-failures single point of failure.
      # Bump deliberately when npm ships a fix you need.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11.5.2

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Validate published packages before letting changesets cut a
      # release. These match the same checks the `verify` CI job runs —
      # double-checking them here guards against a release that lint /
      # test happen to miss (e.g. a drift between dist files and
      # source).
      - run: pnpm typecheck
      - run: pnpm test
      # Mirror the package-validation gates the `verify` CI job runs.
      # Keeps a hypothetical "main drifted from the last green verify
      # run" class of issue from silently publishing.
      - name: publint
        run: |
          pnpm exec publint packages/react --level warning
          pnpm exec publint packages/themes --level warning
      - name: attw
        run: |
          pnpm exec attw --pack packages/react --ignore-rules cjs-resolves-to-esm
          pnpm exec attw --pack packages/themes --ignore-rules cjs-resolves-to-esm

      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          # App-token-authored events trigger downstream workflows,
          # so the Version PR this step opens actually runs CI.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Enables npm provenance attestations on publish. Works only
          # when the job has `id-token: write` AND the package has
          # Trusted Publishing configured on npmjs.com. If either is
          # missing, publish silently falls back to un-attested.
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Release summary
        if: ${{ steps.changesets.outputs.published == 'true' }}
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          {
            echo "## Published"
            echo ''
            echo '```json'
            echo "$PUBLISHED"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
