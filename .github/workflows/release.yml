name: Release
on:
  push:
    branches: [main]
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Validate published packages before letting changesets cut a
      # release. These match the same checks the `verify` CI job runs —
      # double-checking them here guards against a release that lint /
      # test happen to miss (e.g. a drift between dist files and
      # source).
      - run: pnpm typecheck
      - run: pnpm test
      # Mirror the package-validation gates the `verify` CI job runs.
      # Keeps a hypothetical "main drifted from the last green verify
      # run" class of issue from silently publishing.
      - name: publint
        run: |
          pnpm exec publint packages/react --level warning
          pnpm exec publint packages/themes --level warning
      - name: attw
        run: |
          pnpm exec attw --pack packages/react --ignore-rules cjs-resolves-to-esm
          pnpm exec attw --pack packages/themes --ignore-rules cjs-resolves-to-esm

      - uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
