name: Release
# Publishes @arshad-shah/cynosure to npm from `main` with Changesets. Each merge to `main` that carries changesets
# opens (or updates) a "Version packages" pull request; merging that pull request publishes the new version, with npm
# provenance. Publishing therefore only happens when Arshad merges, never from `next`.
on:
  push:
    branches: [main]
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Gates before publishing
        run: pnpm check && pnpm lint && pnpm typecheck && pnpm test && pnpm build && pnpm exec publint && pnpm attw && pnpm size
      - name: Version pull request, or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
