name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (lint · typecheck · test · build · audits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --- Static checks ----------------------------------------------------
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: RTL audit (no physical CSS properties)
        run: pnpm audit:rtl

      # --- Build ------------------------------------------------------------
      - name: Build (packages)
        run: pnpm build

      # --- Tests ------------------------------------------------------------
      - name: Unit tests
        run: pnpm test
      - name: Coverage thresholds
        run: pnpm --filter @lumen/react test:coverage

      # --- Runtime audits ---------------------------------------------------
      - name: Contrast audit (WCAG AA for every theme)
        run: pnpm audit:contrast
      - name: Bundle-size budgets
        run: pnpm size

      # --- Package health ---------------------------------------------------
      - name: publint @lumen/react
        run: pnpm exec publint packages/react --level warning
      - name: publint @lumen/themes
        run: pnpm exec publint packages/themes --level warning
      - name: attw @lumen/react
        run: pnpm exec attw --pack packages/react --ignore-rules cjs-resolves-to-esm
      - name: attw @lumen/themes
        run: pnpm exec attw --pack packages/themes --ignore-rules cjs-resolves-to-esm

  cross-browser:
    name: Cross-browser (Chromium · Firefox · WebKit)
    runs-on: ubuntu-latest
    # Only run on PRs targeting main or on pushes to main — the Playwright
    # install is heavy and pr-branch pushes get their feedback from `verify`.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build (packages)
        run: pnpm build
      - name: Browser-mode tests
        env:
          LUMEN_BROWSER_MODE: '1'
        run: pnpm --filter @lumen/react test:browser
