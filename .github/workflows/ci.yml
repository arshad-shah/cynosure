name: CI
on:
  push:
    branches: [next, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Runners are pinned to Ubuntu 24.04, not `ubuntu-latest`: the visual baselines are rendered on it, and a new image is
# adopted on purpose (with fresh baselines), not on the day GitHub moves the label.
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Conventions, lint, types, unit
        run: pnpm check && pnpm lint && pnpm typecheck && pnpm test
      - name: React 18 smoke (oldest supported peer)
        run: pnpm test:react18
      - name: Stories (Chromium, Firefox, WebKit, touch)
        run: pnpm test:stories
      - name: Coverage floor (95%)
        run: pnpm coverage
      - name: Visual regression (Chromium)
        if: hashFiles('**/__screenshots__/**') != '' && !contains(github.event.head_commit.message, '[baselines]')
        run: pnpm test:visual
      - name: Build, package checks, size budgets
        run: pnpm build && pnpm exec publint && pnpm attw && pnpm size
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: "**/__screenshots__/**"
          if-no-files-found: ignore
  # The documentation site (site/): types, then the same build Cloudflare Pages runs (site plus Storybook in site/dist).
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Site types
        run: pnpm --filter @arshad-shah/cynosure-site check
      - name: Site and Storybook build
        run: pnpm build:site
      - name: The build holds the site and Storybook
        run: test -f site/dist/index.html && test -f site/dist/storybook/index.html
      - name: Every internal link resolves
        run: pnpm --filter @arshad-shah/cynosure-site links

  # The one required status check on main's branch rules. It fans in to every job, so the rules never need touching
  # when jobs are added or renamed (a renamed job would otherwise make protection pass silently, or wait forever).
  gate:
    name: CI gate
    needs: [verify, site]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job green
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = [name for name, meta in needs.items() if meta.get('result') not in ('success', 'skipped')]
          if bad:
              print(f'::error::Jobs not green: {bad}')
              sys.exit(1)
          print('Every job passed.')
          "
