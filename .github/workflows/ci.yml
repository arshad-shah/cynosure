name: CI
on:
  push:
    branches: [next, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Conventions, lint, types, unit
        run: pnpm check && pnpm lint && pnpm typecheck && pnpm test
      - name: Stories (Chromium, Firefox, WebKit, touch)
        run: pnpm test:stories
      - name: Coverage floor (95%)
        run: pnpm coverage
      - name: Visual regression (Chromium)
        if: hashFiles('**/__screenshots__/**') != '' && !contains(github.event.head_commit.message, '[baselines]')
        run: pnpm test:visual
      - name: Build, package checks, size budgets
        run: pnpm build && pnpm exec publint && pnpm attw && pnpm size
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: "**/__screenshots__/**"
          if-no-files-found: ignore
