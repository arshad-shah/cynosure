name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only GITHUB_TOKEN; any job that needs writes must
# opt in explicitly. Limits blast radius if a workflow file is ever
# tampered with.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint · typecheck · test · build · audits)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --- Static checks ----------------------------------------------------
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: RTL audit (no physical CSS properties)
        run: pnpm audit:rtl

      # --- Build ------------------------------------------------------------
      - name: Build (packages)
        run: pnpm build

      # --- Tests ------------------------------------------------------------
      - name: Unit tests
        run: pnpm test
      - name: Coverage thresholds
        run: pnpm --filter @arshad-shah/cynosure-react test:coverage

      # --- Runtime audits ---------------------------------------------------
      - name: Contrast audit (WCAG AA for every theme)
        run: pnpm audit:contrast
      - name: Bundle-size budgets
        run: pnpm size

      # --- Package health ---------------------------------------------------
      # tsup's onSuccess hook emits dist/styles.css; this is a belt-and-braces
      # check in case a build cache was restored from before the hook landed.
      - name: Ensure dist/styles.css exists
        run: node scripts/ensure-styles-css.mjs
      - name: publint @arshad-shah/cynosure-react
        run: pnpm exec publint packages/react --level warning
      - name: publint @arshad-shah/cynosure-themes
        run: pnpm exec publint packages/themes --level warning
      - name: attw @arshad-shah/cynosure-react
        run: pnpm exec attw --pack packages/react --ignore-rules cjs-resolves-to-esm
      - name: attw @arshad-shah/cynosure-themes
        run: pnpm exec attw --pack packages/themes --ignore-rules cjs-resolves-to-esm

  cross-browser:
    name: Cross-browser (Chromium · Firefox · WebKit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only run on PRs targeting main or on pushes to main — the Playwright
    # install is heavy and pr-branch pushes get their feedback from `verify`.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # Skip the whole chain when no `*.browser.test.*` files exist. Phase 14
      # wires the matrix but no tests target real browsers yet; installing
      # ~350 MB of Playwright browsers just to have vitest find zero tests
      # wastes CI time and exposes the job to Playwright-install flakiness.
      - name: Detect browser tests
        id: detect
        run: |
          if find packages/react/src -type f \( -name '*.browser.test.ts' -o -name '*.browser.test.tsx' \) -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No *.browser.test.{ts,tsx} files found — skipping Playwright install + run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        if: steps.detect.outputs.present == 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build (packages)
        if: steps.detect.outputs.present == 'true'
        run: pnpm build
      - name: Browser-mode tests
        if: steps.detect.outputs.present == 'true'
        env:
          CYNOSURE_BROWSER_MODE: '1'
        run: pnpm --filter @arshad-shah/cynosure-react test:browser

  # Single required status check for branch protection. Listing every
  # individual job in the ruleset is fragile (rename a job → protection
  # silently passes); a stable `gate` name that fans in to every job
  # means the ruleset never needs touching when CI structure changes.
  gate:
    name: CI gate
    needs: [verify, cross-browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require all upstream jobs green
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          # A job that was skipped (cross-browser on PR branch pushes that
          # bypass the trigger filter) is fine. Failure/cancelled is not.
          echo "$RESULTS" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = [name for name, meta in needs.items() if meta.get('result') not in ('success', 'skipped')]
          if bad:
              print(f'::error::Upstream jobs not green: {bad}')
              sys.exit(1)
          print('All upstream jobs passed.')
          "
